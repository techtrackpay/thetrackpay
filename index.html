<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/jpeg" href="/image/Trackpay.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    let savedTheme;
    try { savedTheme = localStorage.getItem('trackpay-theme'); } catch { /* Storage may be unavailable in private contexts. */ }
    const initialTheme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = initialTheme;
    document.documentElement.style.colorScheme = initialTheme;
  </script>
  <title>TrackPay | TheTrackPay — The Payment App with a Financial Intelligence Layer for India</title>
  <meta name="description"
    content="Meet TrackPay: UPI payments, a unified view of your financial activity and Artha AI. Explore interactive previews of a more connected money experience for India." />
  <meta name="keywords"
    content="TrackPay, TheTrackPay, financial intelligence, payment app India, payment tracker, financial management, money automation" />

  <!-- Fonts: Inter (sans) + Instrument Serif (display) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
